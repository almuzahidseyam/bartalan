name: bartalan

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Initialize the project first}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [local]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  mattermost:
    image: ${MATTERMOST_IMAGE:?}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      TZ: ${TZ:-Asia/Dhaka}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=10'
      MM_SERVICESETTINGS_SITEURL: ${SITE_URL:?}
      MM_SERVICESETTINGS_LISTENADDRESS: ':8065'
      MM_SERVICESETTINGS_ENABLELOCALMODE: 'true'
      MM_SERVICESETTINGS_ENABLEOUTGOINGWEBHOOKS: 'false'
      MM_SERVICESETTINGS_ENABLELINKPREVIEWS: 'false'
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: 'false'
      MM_SERVICESETTINGS_ENABLEINSECUREOUTGOINGCONNECTIONS: 'false'
      MM_TEAMSETTINGS_SITENAME: BartaLAN
      MM_TEAMSETTINGS_ENABLEOPENSERVER: 'true'
      MM_TEAMSETTINGS_ENABLEUSERCREATION: 'true'
      MM_PASSWORDSETTINGS_MINIMUMLENGTH: '12'
      MM_PASSWORDSETTINGS_LOWERCASE: 'true'
      MM_PASSWORDSETTINGS_UPPERCASE: 'true'
      MM_PASSWORDSETTINGS_NUMBER: 'true'
      MM_PASSWORDSETTINGS_SYMBOL: 'true'
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: 'true'
      MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL: 'true'
      MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME: 'true'
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: 'false'
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: 'false'
      MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: 'false'
      MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER: ''
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: 'false'
      MM_SERVICESETTINGS_ENABLEDEVELOPER: 'false'
      MM_SERVICESETTINGS_ENABLETUTORIAL: 'false'
      MM_SERVICESETTINGS_ENABLEGIFPICKER: 'false'
      MM_ANNOUNCEMENTSETTINGS_ADMINNOTICESENABLED: 'false'
      MM_ANNOUNCEMENTSETTINGS_USERNOTICESENABLED: 'false'
      MM_METRICSSETTINGS_ENABLE: 'false'
      MM_PLUGINSETTINGS_ENABLE: 'false'
      MM_PLUGINSETTINGS_ENABLEMARKETPLACE: 'false'
      MM_PLUGINSETTINGS_ENABLEAUTOMATICPREPACKAGEDPLUGINS: 'false'
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: 'false'
      MM_FILESETTINGS_DRIVERNAME: local
      MM_FILESETTINGS_DIRECTORY: /mattermost/data/
      MM_FILESETTINGS_MAXFILESIZE: '26214400'
      MM_SUPPORTSETTINGS_ENABLEASKCOMMUNITYLINK: 'false'
    volumes:
      - config:/mattermost/config
      - files:/mattermost/data
      - logs:/mattermost/logs
      - plugins:/mattermost/plugins
      - client_plugins:/mattermost/client/plugins
      - indexes:/mattermost/bleve-indexes
    networks: [local]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  gateway:
    image: ${GATEWAY_IMAGE:?}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      mattermost: {condition: service_healthy}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-18065}:8443'
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/proxy.conf:/etc/nginx/bartalan-proxy.conf:ro
      - type: bind
        source: ./.secrets/tls/server
        target: /etc/nginx/tls
        read_only: true
        bind: {create_host_path: false}
    entrypoint: [nginx, '-g', 'daemon off;']
    networks: [local, ingress]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/api/v4/system/ping']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

networks:
  local:
    internal: true
  ingress:


volumes:
  database:
  config:
  files:
  logs:
  plugins:
  client_plugins:
  indexes:
