worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 26m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $request_method $account_limit_key {
        default '';
        POST $binary_remote_addr;
    }
    limit_req_zone $account_limit_key zone=signup:1m rate=5r/m;
    limit_req_zone $account_limit_key zone=login:1m rate=20r/m;
    limit_req_status 429;

    # Health checks stay on an unpublished, container-local HTTP listener.
    server {
        listen 127.0.0.1:8080;
        location = /api/v4/system/ping { proxy_pass http://mattermost:8065; }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;
        error_page 497 =308 https://$http_host$request_uri;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        location = /api/v4/users {
            limit_req zone=signup burst=20 nodelay;
            include /etc/nginx/bartalan-proxy.conf;
        }
        location = /api/v4/users/login {
            limit_req zone=login burst=40 nodelay;
            include /etc/nginx/bartalan-proxy.conf;
        }
        location / {
            include /etc/nginx/bartalan-proxy.conf;
        }
    }
}
